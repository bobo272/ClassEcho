[project]
name = "classecho"
version = "0.0.0"
description = "中文课堂录音转录与可回听核对的 AI 笔记工具"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "alembic>=1.20.0",
    "fastapi>=0.143.1",
    "httpx>=0.28.1",
    "mlx-whisper; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "opencc>=1.4.2",
    "pydantic>=2.14.1",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.32",
    "redis>=8.1.0",
    "rq>=2.12.0",
    "sqlalchemy>=2.1.4",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff>=0.17.0",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
